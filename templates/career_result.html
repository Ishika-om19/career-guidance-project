{% extends "base.html" %}

{% block title %}
Career Guidance Result
{% endblock %}

{% block content %}

<section class="result-page">

    <div class="result-heading">
        <h1>Your Personalized Career Guidance 🚀</h1>

        <p>
            Hello {{ name }}! Here is your personalized career roadmap.
        </p>
    </div>

    <div class="guidance-result-card">

        <div class="ai-result-header">
            <span>✨ AI Career Recommendation</span>
        </div>

        <div class="guidance-content">
            {{ guidance }}
        </div>

    </div>

    <div class="result-actions">
        <a href="/" class="btn btn-primary">
            ← Back to Career Guidance
        </a>
    </div>

</section>

{% endblock %}
