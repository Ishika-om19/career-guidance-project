{% extends "base.html" %}

{% block title %}
Career Guidance Result
{% endblock %}

{% block content %}

<section class="container py-5">

    <h2 class="text-center mb-4 result-title">
        Your Personalized Career Guidance🚀
    </h2>
    <p class="text-center text-muted">Hello {{ name}} ! Here  is your personalized career roadmap.</p>

    <div class="card shadow-sm p-4 guidance-card">
        <div class="guidance-content text-start">{{ guidance | replace("###","") | replace("**", "")}}</div>
    </div>

</section>

{% endblock %}
