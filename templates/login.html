{% extends "base.html" %}

{% block title %}
Login - Career Guidance
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <h1>Welcome Back 👋</h1>

        <p>Login to continue your career journey.</p>

        <form method="POST" action="/login">

            <div>
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div>
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">Create Account</a>
        </p>

    </div>

</section>

{% endblock %}
